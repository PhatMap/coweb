name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install launcher dependencies
        run: bun install --cwd launcher --frozen-lockfile

      - name: Root typecheck
        run: bun run typecheck

      - name: Launcher typecheck
        run: bun run launcher:typecheck

      - name: Root tests
        run: bun test ./tests

      - name: Launcher tests
        run: bun run launcher:test

      - name: Launcher build
        run: bun run launcher:build